name: Android APK LISTOCO

# Manual a proposito: compila un APK de debug para demostrar la version Android.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Compilar APK de debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Instalar dependencias
        run: npm ci

      - name: Construir frontend
        run: npm run build

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Dar permiso de ejecucion a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK de debug
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verificar y renombrar el APK
        run: |
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk" || { echo "::error::No se genero el APK"; exit 1; }
          cp "$apk" "listoco-debug-${GITHUB_SHA::7}.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v5
        with:
          name: listoco-debug-apk
          path: frontend/listoco-debug-*.apk
          if-no-files-found: error
          retention-days: 14